# ╔══════════════════════════════════════════════════════════════╗
# ║  VOID — Hyprpaper Configuration                             ║
# ║  ~/.config/hypr/hyprpaper.conf                               ║
# ╚══════════════════════════════════════════════════════════════╝

# Apply to all monitors with a fallback wallpaper.
wallpaper {
    monitor =
    path = ~/.config/hypr/wallpaper/void.png
    fit_mode = cover
}

# Disable splash text
splash = false
ipc = true
