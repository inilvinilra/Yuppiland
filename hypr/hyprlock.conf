# ╔══════════════════════════════════════════════════════════════╗
# ║  VOID — Hyprlock Configuration                               ║
# ║  ~/.config/hypr/hyprlock.conf                                 ║
# ╚══════════════════════════════════════════════════════════════╝

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 3
    no_fade_in = false
    no_fade_out = false
}

# --- BACKGROUND ---
background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 8
    noise = 0.03
    contrast = 0.7
    brightness = 0.3
    vibrancy = 0.0
    color = rgb(000000)
}

# --- CLOCK ---
label {
    monitor =
    text = $TIME
    color = rgb(e8e8e8)
    font_size = 64
    font_family = JetBrains Mono Nerd Font
    position = 0, 160
    halign = center
    valign = center
}

# --- DATE ---
label {
    monitor =
    text = cmd[update:3600000] date +"%A, %B %d"
    color = rgb(888888)
    font_size = 16
    font_family = JetBrains Mono Nerd Font
    position = 0, 90
    halign = center
    valign = center
}

# --- GREETING ---
label {
    monitor =
    text = $USER
    color = rgb(555555)
    font_size = 12
    font_family = JetBrains Mono Nerd Font
    position = 0, -40
    halign = center
    valign = center
}

# --- PASSWORD INPUT ---
input-field {
    monitor =
    size = 280, 42
    outline_thickness = 1
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    dots_rounding = -1
    outer_color = rgb(1a1a1a)
    inner_color = rgb(080808)
    font_color = rgb(cccccc)
    fade_on_empty = true
    fade_timeout = 2000
    placeholder_text = <span foreground="#555555">enter password...</span>
    hide_input = false
    rounding = 5
    check_color = rgb(5a8a5a)
    fail_color = rgb(cc4444)
    fail_text = <span foreground="#cc4444">authentication failed</span>
    fail_timeout = 2000
    fail_transition = 200
    capslock_color = rgb(c8a84b)
    numlock_color = -1
    bothlock_color = -1
    position = 0, -80
    halign = center
    valign = center
}
