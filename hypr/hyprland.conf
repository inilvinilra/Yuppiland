# ╔══════════════════════════════════════════════════════════════╗
# ║  VOID — Hyprland Configuration                              ║
# ║  ~/.config/hypr/hyprland.conf                                ║
# ╚══════════════════════════════════════════════════════════════╝

# --- ENVIRONMENT ---
env = XCURSOR_SIZE,24
env = XCURSOR_THEME,Adwaita
env = QT_QPA_PLATFORM,wayland
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = GDK_BACKEND,wayland,x11,*
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = MOZ_ENABLE_WAYLAND,1

# --- MONITOR ---
# Format: monitor = name, resolution@hz, position, scale
# Use `hyprctl monitors` to find your monitor name
monitor = ,preferred,auto,1

# --- INPUT ---
input {
    kb_layout = tr
    kb_options = caps:escape
    follow_mouse = 1
    sensitivity = 0
    accel_profile = flat

    touchpad {
        natural_scroll = true
        tap-to-click = true
        drag_lock = true
        disable_while_typing = true
    }
}

# --- GENERAL ---
general {
    gaps_in = 6
    gaps_out = 14
    border_size = 1
    col.active_border = rgb(555555)
    col.inactive_border = rgb(1a1a1a)
    layout = dwindle
    allow_tearing = false
    resize_on_border = true
}

# --- DECORATION ---
decoration {
    rounding = 5

    blur {
        enabled = true
        size = 8
        passes = 4
        noise = 0.02
        contrast = 1.0
        brightness = 0.78
        vibrancy = 0.0
        xray = false
        ignore_opacity = false
    }

    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(00000088)
        offset = 0 4
    }

    dim_inactive = true
    dim_strength = 0.05
}

# --- ANIMATIONS ---
animations {
    enabled = true

    # void curves — fast start, smooth end
    bezier = void, 0.16, 1, 0.3, 1
    bezier = voidSlow, 0.22, 1, 0.36, 1
    bezier = voidSnap, 0.0, 0.85, 0.15, 1

    animation = windows, 1, 3, void, popin 85%
    animation = windowsOut, 1, 3, void, popin 85%
    animation = windowsMove, 1, 3, void, slide
    animation = border, 1, 4, void
    animation = borderangle, 1, 30, voidSlow, loop
    animation = fade, 1, 3, void
    animation = workspaces, 1, 3, void, slide
    animation = specialWorkspace, 1, 3, void, slidevert
    animation = layers, 1, 2, voidSnap, fade
}

# --- LAYOUT ---
dwindle {
    preserve_split = true
    force_split = 2
    smart_resizing = true
}

master {
    new_status = master
    mfact = 0.55
}

# --- MISC ---
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    vrr = 1
    animate_manual_resizes = true
    animate_mouse_windowdragging = true
    focus_on_activate = true
}

# --- CURSOR ---
cursor {
    inactive_timeout = 5
    hide_on_key_press = true
}

# --- XWAYLAND ---
xwayland {
    force_zero_scaling = true
}

# ─────────────────────────────────────────────────────────────
# WINDOW RULES
# ─────────────────────────────────────────────────────────────

# Hyprland 0.55 uses the new windowrule syntax. The third opacity
# value keeps fullscreen windows fully opaque for videos and games.
windowrule = match:class kitty, opacity 0.82 0.68 1.0
windowrule = match:class kitty-float, opacity 0.82 0.68 1.0, float on, size 720 480, center on

windowrule = match:class brave-browser, opacity 0.82 0.68 1.0
windowrule = match:class chromium, opacity 0.82 0.68 1.0
windowrule = match:class firefox, opacity 0.82 0.68 1.0
windowrule = match:class zen-browser, opacity 0.82 0.68 1.0

windowrule = match:class Thunar, opacity 0.82 0.68 1.0
windowrule = match:class thunar, opacity 0.82 0.68 1.0
windowrule = match:class org.kde.dolphin, opacity 0.82 0.68 1.0

windowrule = match:class Codex, opacity 0.88 0.78 1.0
windowrule = match:class antigravity, opacity 0.88 0.78 1.0
windowrule = match:class cursor, opacity 0.88 0.78 1.0
windowrule = match:class VSCodium, opacity 0.88 0.78 1.0

windowrule = match:class pavucontrol, opacity 0.82 0.68 1.0, float on, size 640 420, center on
windowrule = match:class nm-connection-editor, opacity 0.82 0.68 1.0, float on, size 560 400, center on
windowrule = match:class blueman-manager, opacity 0.82 0.68 1.0, float on, size 560 400, center on

# ─────────────────────────────────────────────────────────────
# KEYBINDINGS
# ─────────────────────────────────────────────────────────────

$mod = SUPER
$terminal = kitty
$browser = ~/.config/hypr/scripts/browser.sh
$fileManager = ~/.config/hypr/scripts/file-manager.sh

# --- CORE ---
bind = $mod, Return, exec, $terminal
bind = $mod SHIFT, Return, exec, $terminal --class kitty-float
bind = $mod, Q, killactive,
bind = $mod SHIFT, Q, exit,
bind = $mod, D, exec, rofi -show drun -theme ~/.config/rofi/themes/void.rasi
bind = $mod SHIFT, D, exec, rofi -show run -theme ~/.config/rofi/themes/void.rasi
bind = $mod, V, togglefloating,
bind = $mod, F, fullscreen, 0
bind = $mod SHIFT, F, fullscreen, 1
bind = $mod, P, pseudo,
bind = $mod, E, exec, $fileManager
bind = $mod, B, exec, $browser
bind = $mod, period, exec, dunstctl close
bind = $mod SHIFT, period, exec, dunstctl close-all
bind = $mod, grave, exec, dunstctl history-pop
bind = $mod, L, exec, hyprlock
bind = $mod, Backspace, exec, hyprlock

# --- FOCUS ---
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bind = $mod, h, movefocus, l
bind = $mod, j, movefocus, d
bind = $mod, k, movefocus, u
bind = $mod, l, movefocus, r

# --- MOVE WINDOWS ---
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d
bind = $mod SHIFT, h, movewindow, l
bind = $mod SHIFT, j, movewindow, d
bind = $mod SHIFT, k, movewindow, u
bind = $mod SHIFT, l, movewindow, r

# --- RESIZE ---
binde = $mod CTRL, left, resizeactive, -30 0
binde = $mod CTRL, right, resizeactive, 30 0
binde = $mod CTRL, up, resizeactive, 0 -30
binde = $mod CTRL, down, resizeactive, 0 30
binde = $mod CTRL, h, resizeactive, -30 0
binde = $mod CTRL, j, resizeactive, 0 30
binde = $mod CTRL, k, resizeactive, 0 -30
binde = $mod CTRL, l, resizeactive, 30 0

# --- WORKSPACES ---
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# --- MOVE TO WORKSPACE ---
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# --- SILENT MOVE (move without switching) ---
bind = $mod ALT, 1, movetoworkspacesilent, 1
bind = $mod ALT, 2, movetoworkspacesilent, 2
bind = $mod ALT, 3, movetoworkspacesilent, 3
bind = $mod ALT, 4, movetoworkspacesilent, 4
bind = $mod ALT, 5, movetoworkspacesilent, 5
bind = $mod ALT, 6, movetoworkspacesilent, 6
bind = $mod ALT, 7, movetoworkspacesilent, 7
bind = $mod ALT, 8, movetoworkspacesilent, 8
bind = $mod ALT, 9, movetoworkspacesilent, 9
bind = $mod ALT, 0, movetoworkspacesilent, 10

# --- SCRATCHPADS (named special workspaces) ---
bind = $mod, minus, togglespecialworkspace, terminal
bind = $mod SHIFT, minus, movetoworkspace, special:terminal
bind = $mod, equal, togglespecialworkspace, monitor
bind = $mod SHIFT, equal, movetoworkspace, special:monitor

# --- WINDOW GROUPS (tabbed) ---
bind = $mod, G, togglegroup,
bind = $mod, Tab, changegroupactive, f
bind = $mod SHIFT, Tab, changegroupactive, b
bind = $mod CTRL, G, moveoutofgroup,

# --- MISC BINDS ---
bind = $mod SHIFT, G, exec, ~/.config/hypr/scripts/gamemode.sh
bind = $mod, W, exec, ~/.config/hypr/scripts/wallpaper.sh

# --- SUBMAP: RESIZE MODE ---
bind = $mod, R, submap, resize
submap = resize
binde = , right, resizeactive, 40 0
binde = , left, resizeactive, -40 0
binde = , up, resizeactive, 0 -40
binde = , down, resizeactive, 0 40
binde = , l, resizeactive, 40 0
binde = , h, resizeactive, -40 0
binde = , k, resizeactive, 0 -40
binde = , j, resizeactive, 0 40
bind = , escape, submap, reset
bind = , Return, submap, reset
submap = reset

# --- MOUSE ---
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

# --- MEDIA / FUNCTION KEYS ---
bindl = , XF86AudioMute, exec, ~/.config/hypr/scripts/volume.sh mute
binde = , XF86AudioRaiseVolume, exec, ~/.config/hypr/scripts/volume.sh up
binde = , XF86AudioLowerVolume, exec, ~/.config/hypr/scripts/volume.sh down
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
binde = , XF86MonBrightnessUp, exec, ~/.config/hypr/scripts/brightness.sh up
binde = , XF86MonBrightnessDown, exec, ~/.config/hypr/scripts/brightness.sh down

# --- SCREENSHOTS ---
bind = , Print, exec, ~/.config/hypr/scripts/screenshot.sh clipboard
bind = SHIFT, Print, exec, ~/.config/hypr/scripts/screenshot.sh full
bind = $mod, Print, exec, ~/.config/hypr/scripts/screenshot.sh area
bind = $mod SHIFT, Print, exec, ~/.config/hypr/scripts/screenshot.sh window

# --- CLIPBOARD ---
bind = $mod SHIFT, V, exec, cliphist list | rofi -dmenu -p "Clipboard" -theme ~/.config/rofi/themes/void.rasi | cliphist decode | wl-copy

# --- POWER MENU ---
bind = $mod SHIFT, E, exec, ~/.config/hypr/scripts/power-menu.sh

# --- ROFI MENUS ---
bind = $mod, N, exec, ~/.config/hypr/scripts/wifi-menu.sh
bind = $mod SHIFT, B, exec, ~/.config/hypr/scripts/bluetooth-menu.sh
bind = $mod SHIFT, S, exec, ~/.config/hypr/scripts/screenshot-menu.sh
bind = $mod, A, exec, ~/.config/hypr/scripts/audio-menu.sh
bind = $mod, semicolon, exec, ~/.config/hypr/scripts/emoji-picker.sh

# ─────────────────────────────────────────────────────────────
# AUTOSTART
# ─────────────────────────────────────────────────────────────

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = dbus-update-activation-environment --systemd --all

exec-once = hyprpaper
exec-once = waybar
exec-once = dunst
# Disabled for now: current package crashes on startup on this host.
# Lock remains available on demand via Super+L / Super+Backspace.
# exec-once = hypridle
exec-once = nm-applet --indicator
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = /usr/lib/polkit-kde-authentication-agent-1

# Set cursor theme
exec-once = hyprctl setcursor Adwaita 24
