# ╔══════════════════════════════════════════════════════════════╗
# ║  VOID — Kitty Terminal Configuration                         ║
# ║  ~/.config/kitty/kitty.conf                                   ║
# ╚══════════════════════════════════════════════════════════════╝

# --- FONT ---
font_family      JetBrains Mono Nerd Font
bold_font        JetBrains Mono Nerd Font Bold
italic_font      JetBrains Mono Nerd Font Italic
bold_italic_font JetBrains Mono Nerd Font Bold Italic
font_size        12.0
disable_ligatures never

# --- CURSOR ---
cursor                  #cccccc
cursor_text_color       #000000
cursor_shape            beam
cursor_beam_thickness   1.5
cursor_blink_interval   0.5
cursor_stop_blinking_after 15.0

# --- SCROLLBACK ---
scrollback_lines        10000
scrollback_pager        less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
scrollback_fill_enlarged_window yes

# --- MOUSE ---
mouse_hide_wait         3.0
url_color               #888888
url_style               single
open_url_with           default
url_prefixes            file ftp ftps gemini git gopher http https irc ircs kitty mailto news sftp ssh
detect_urls             yes
copy_on_select          clipboard

# --- PERFORMANCE ---
repaint_delay           8
input_delay             2
sync_to_monitor         yes

# --- BELL ---
enable_audio_bell       no
visual_bell_duration    0.0
window_alert_on_bell    no
bell_on_tab             ""

# --- WINDOW ---
remember_window_size    no
initial_window_width    960
initial_window_height   560
window_padding_width    12 14 12 14
window_margin_width     0
single_window_margin_width -1
placement_strategy      center
hide_window_decorations yes
confirm_os_window_close 0
resize_in_steps         no

# --- TAB BAR ---
tab_bar_edge            bottom
tab_bar_style           powerline
tab_powerline_style     slanted
tab_bar_min_tabs        2
tab_bar_margin_width    0.0
tab_bar_margin_height   0.0 0.0
tab_title_template      " {index}: {title} "
active_tab_title_template " {index}: {title} "

active_tab_foreground   #e8e8e8
active_tab_background   #1a1a1a
active_tab_font_style   bold
inactive_tab_foreground #555555
inactive_tab_background #080808
inactive_tab_font_style normal
tab_bar_background      #000000
tab_bar_margin_color    #000000

# --- COLOR SCHEME: VOID ---
foreground              #cccccc
background              #000000
background_opacity      0.78
selection_foreground     #000000
selection_background     #cccccc
dynamic_background_opacity yes

# black
color0  #080808
color8  #2a2a2a

# red
color1  #cc4444
color9  #cc4444

# green
color2  #5a8a5a
color10 #5a8a5a

# yellow
color3  #c8a84b
color11 #c8a84b

# blue (mapped to subtext for void)
color4  #555555
color12 #888888

# magenta (mapped to muted tones)
color5  #555555
color13 #888888

# cyan (mapped to subtle gray)
color6  #888888
color14 #cccccc

# white
color7  #cccccc
color15 #e8e8e8

# extra (mark colors)
mark1_foreground #000000
mark1_background #cccccc
mark2_foreground #000000
mark2_background #888888
mark3_foreground #000000
mark3_background #555555

# --- ADVANCED ---
allow_hyperlinks     yes
shell_integration    enabled
term                 xterm-kitty

# --- KEYBINDINGS ---
map ctrl+shift+c        copy_to_clipboard
map ctrl+shift+v        paste_from_clipboard
map ctrl+shift+equal    change_font_size all +1.0
map ctrl+shift+minus    change_font_size all -1.0
map ctrl+shift+0        change_font_size all 0
map ctrl+shift+t        new_tab_with_cwd
map ctrl+shift+q        close_tab
map ctrl+shift+right    next_tab
map ctrl+shift+left     previous_tab
map ctrl+shift+l        next_layout
map ctrl+shift+f        show_scrollback
map ctrl+shift+enter    new_window_with_cwd
map ctrl+shift+w        close_window
map ctrl+shift+]        next_window
map ctrl+shift+[        previous_window
map ctrl+shift+f5       load_config_file
map ctrl+shift+a>m      set_background_opacity +0.05
map ctrl+shift+a>l      set_background_opacity -0.05
map ctrl+shift+a>1      set_background_opacity 1
map ctrl+shift+a>d      set_background_opacity default
